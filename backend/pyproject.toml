[project]
name = "pm-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "itsdangerous",
    "openai",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
# Live tests call OpenRouter for real; run them explicitly with `pytest -m live`.
markers = ["live: calls the real OpenRouter API (needs OPENROUTER_API_KEY)"]
addopts = "-m 'not live'"
